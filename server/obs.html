<!DOCTYPE html>
<html>
<head>
    <title>ShareBridge OBS</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: black; overflow: hidden; display: flex; justify-content: center; align-items: center; color: white; font-family: sans-serif; }
        video { width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; }
        #status { position: absolute; top: 10px; left: 10px; font-size: 12px; opacity: 0.5; z-index: 10; }
    </style>
</head>
<body>
    <div id="status">Connecting...</div>
    <video id="remoteVideo" autoplay playsinline></video>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('roomId');
        const targetId = params.get('targetId');
        const targetDeviceId = params.get('targetDeviceId');
        const type = params.get('type') || 'camera';
        
        const statusEl = document.getElementById('status');
        const videoEl = document.getElementById('remoteVideo');
        
        if (!roomId || (!targetId && !targetDeviceId)) {
            statusEl.innerText = 'Error: Missing parameters (roomId, targetId/targetDeviceId)';
        } else {
            const socket = io();
            let pc = null;
            let pendingCandidates = [];
            let isWatching = false;
            let currentTargetSocketId = targetId;

            function stopWatching() {
                if (pc) {
                    pc.close();
                    pc = null;
                }
                if (currentTargetSocketId) {
                    socket.emit('leave_watch', {
                        targetSocketId: currentTargetSocketId,
                        streamType: type
                    });
                }
                pendingCandidates = [];
                isWatching = false;
                videoEl.srcObject = null;
            }

            async function startWatching() {
                if (isWatching) return;
                isWatching = true;

                statusEl.innerText = 'Connecting to stream...';
                statusEl.style.display = 'block';
                if (!currentTargetSocketId) {
                    statusEl.innerText = 'Target device offline';
                    statusEl.style.display = 'block';
                    isWatching = false;
                    return;
                }

                socket.emit('join_watch', {
                    targetSocketId: currentTargetSocketId,
                    streamType: type,
                    deviceName: 'OBS'
                });

                pc = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                pc.addTransceiver('video', { direction: 'recvonly' });
                pc.addTransceiver('audio', { direction: 'recvonly' });

                pc.ontrack = (event) => {
                    console.log('Track received:', event.track.kind);
                    if (event.streams && event.streams[0]) {
                        videoEl.srcObject = event.streams[0];
                    } else {
                        videoEl.srcObject = new MediaStream([event.track]);
                    }
                    statusEl.innerText = 'Streaming: ' + type;
                    setTimeout(() => {
                        if (videoEl.srcObject) statusEl.style.display = 'none';
                    }, 3000);
                };

                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        socket.emit('signal', {
                            to: currentTargetSocketId,
                            signal: event.candidate,
                            streamType: type
                        });
                    }
                };

                pc.oniceconnectionstatechange = () => {
                    console.log('ICE state:', pc.iceConnectionState);
                    if (pc.iceConnectionState === 'failed') {
                        statusEl.innerText = 'Connection failed';
                        statusEl.style.display = 'block';
                    }
                };

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                socket.emit('signal', {
                    to: currentTargetSocketId,
                    signal: pc.localDescription,
                    streamType: type
                });
            }

            socket.on('connect', () => {
                statusEl.innerText = 'Connected to server, joining room...';
                socket.emit('join', { room: roomId, deviceName: 'OBS' });
            });

            socket.on('signal', async (data) => {
                if (data.from !== currentTargetSocketId || data.streamType !== type) return;
                
                try {
                    if (data.signal.type === 'answer') {
                        console.log('Received answer');
                        await pc.setRemoteDescription(new RTCSessionDescription(data.signal));
                        while (pendingCandidates.length > 0) {
                            await pc.addIceCandidate(new RTCIceCandidate(pendingCandidates.shift()));
                        }
                    } else if (data.signal.candidate) {
                        if (pc.remoteDescription) {
                            await pc.addIceCandidate(new RTCIceCandidate(data.signal));
                        } else {
                            pendingCandidates.push(data.signal);
                        }
                    }
                } catch (e) {
                    console.error('Signal error:', e);
                }
            });

            socket.on('room_status', (devices) => {
                const target = targetDeviceId
                    ? devices.find(d => d.deviceId === targetDeviceId)
                    : devices.find(d => d.socketId === targetId);
                const nextTargetSocketId = target?.socketId || null;
                const isSharing = target && target.sharing && target.sharing[type];

                if (nextTargetSocketId !== currentTargetSocketId) {
                    if (isWatching) stopWatching();
                    currentTargetSocketId = nextTargetSocketId;
                }

                if (isSharing && !isWatching) {
                    startWatching();
                } else if (!isSharing && isWatching) {
                    stopWatching();
                    statusEl.innerText = 'Stream ended. Waiting for restart...';
                    statusEl.style.display = 'block';
                } else if (target && !isSharing && !isWatching) {
                    statusEl.innerText = 'Target device online, but not sharing ' + type;
                    statusEl.style.display = 'block';
                } else if (!target) {
                    if (isWatching) stopWatching();
                    statusEl.innerText = 'Target device offline';
                    statusEl.style.display = 'block';
                }
            });

            socket.on('disconnect', () => {
                statusEl.innerText = 'Disconnected';
                statusEl.style.display = 'block';
            });
        }
    </script>
</body>
</html>
